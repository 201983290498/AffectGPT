<svg width="1200" height="1600" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义样式 -->
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .box { fill: #e8f4fd; stroke: #2196f3; stroke-width: 2; }
      .process { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; }
      .data { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; }
      .model { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2; }
      .output { fill: #ffebee; stroke: #f44336; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="600" y="30" class="title">AffectGPT 数据处理流程图</text>

  <!-- 1. 数据读取阶段 -->
  <rect x="50" y="60" width="1100" height="120" class="box" rx="10"/>
  <text x="600" y="85" class="title" style="font-size: 16px;">1. 数据读取阶段 (Data Reading)</text>
  
  <!-- 数据源 -->
  <rect x="80" y="100" width="120" height="60" class="data" rx="5"/>
  <text x="140" y="125" class="text">视频文件</text>
  <text x="140" y="140" class="small-text">(.mp4/.avi)</text>
  
  <rect x="220" y="100" width="120" height="60" class="data" rx="5"/>
  <text x="280" y="125" class="text">音频文件</text>
  <text x="280" y="140" class="small-text">(.wav)</text>
  
  <rect x="360" y="100" width="120" height="60" class="data" rx="5"/>
  <text x="420" y="125" class="text">人脸数据</text>
  <text x="420" y="140" class="small-text">(.npy)</text>
  
  <rect x="500" y="100" width="120" height="60" class="data" rx="5"/>
  <text x="560" y="125" class="text">字幕文本</text>
  <text x="560" y="140" class="small-text">(subtitle)</text>

  <!-- read_frame_face_audio_text 函数 -->
  <rect x="700" y="100" width="200" height="60" class="process" rx="5"/>
  <text x="800" y="125" class="text">read_frame_face_audio_text()</text>
  <text x="800" y="140" class="small-text">数据读取统一接口</text>

  <!-- 箭头 -->
  <line x1="200" y1="130" x2="680" y2="130" class="arrow"/>
  <line x1="340" y1="130" x2="680" y2="130" class="arrow"/>
  <line x1="480" y1="130" x2="680" y2="130" class="arrow"/>
  <line x1="620" y1="130" x2="680" y2="130" class="arrow"/>

  <!-- 2. 数据预处理阶段 -->
  <rect x="50" y="200" width="1100" height="200" class="box" rx="10"/>
  <text x="600" y="225" class="title" style="font-size: 16px;">2. 数据预处理阶段 (Data Preprocessing)</text>

  <!-- 视频帧处理 -->
  <rect x="80" y="250" width="150" height="80" class="process" rx="5"/>
  <text x="155" y="275" class="text">load_video()</text>
  <text x="155" y="290" class="small-text">• 采样8帧</text>
  <text x="155" y="305" class="small-text">• 调整尺寸224x224</text>
  <text x="155" y="320" class="small-text">• 输出: [3,8,224,224]</text>

  <!-- 人脸处理 -->
  <rect x="250" y="250" width="150" height="80" class="process" rx="5"/>
  <text x="325" y="275" class="text">load_face()</text>
  <text x="325" y="290" class="small-text">• 从.npy加载</text>
  <text x="325" y="305" class="small-text">• 采样8帧</text>
  <text x="325" y="320" class="small-text">• 输出: [3,8,224,224]</text>

  <!-- 音频处理 -->
  <rect x="420" y="250" width="150" height="80" class="process" rx="5"/>
  <text x="495" y="275" class="text">load_audio()</text>
  <text x="495" y="290" class="small-text">• 8个音频片段</text>
  <text x="495" y="305" class="small-text">• 每段2秒</text>
  <text x="495" y="320" class="small-text">• 输出: [8,1,16000*2]</text>

  <!-- 音频变换 -->
  <rect x="590" y="250" width="150" height="80" class="process" rx="5"/>
  <text x="665" y="275" class="text">transform_audio()</text>
  <text x="665" y="290" class="small-text">• 转换为Mel谱</text>
  <text x="665" y="305" class="small-text">• Z-score标准化</text>
  <text x="665" y="320" class="small-text">• 输出: [8,1,128,204]</text>

  <!-- 图像处理 -->
  <rect x="760" y="250" width="150" height="80" class="process" rx="5"/>
  <text x="835" y="275" class="text">image_processor()</text>
  <text x="835" y="290" class="small-text">• PIL图像处理</text>
  <text x="835" y="305" class="small-text">• 调整尺寸</text>
  <text x="835" y="320" class="small-text">• 输出: [3,1,224,224]</text>

  <!-- 视觉处理器 -->
  <rect x="930" y="250" width="150" height="80" class="process" rx="5"/>
  <text x="1005" y="275" class="text">vis_processor</text>
  <text x="1005" y="290" class="small-text">• 数据增强</text>
  <text x="1005" y="305" class="small-text">• 标准化</text>
  <text x="1005" y="320" class="small-text">• 张量变换</text>

  <!-- 箭头从读取到预处理 -->
  <line x1="800" y1="160" x2="800" y2="240" class="arrow"/>

  <!-- 预处理内部箭头 -->
  <line x1="570" y1="290" x2="590" y2="290" class="arrow"/>
  <line x1="910" y1="290" x2="930" y2="290" class="arrow"/>

  <!-- 3. 数据后处理阶段 -->
  <rect x="50" y="420" width="1100" height="200" class="box" rx="10"/>
  <text x="600" y="445" class="title" style="font-size: 16px;">3. 数据后处理阶段 (Data Postprocessing)</text>

  <!-- 各种后处理函数 -->
  <rect x="80" y="470" width="180" height="80" class="model" rx="5"/>
  <text x="170" y="495" class="text">postprocess_frame()</text>
  <text x="170" y="510" class="small-text">• encode_video_merge()</text>
  <text x="170" y="525" class="small-text">• 视频特征编码</text>
  <text x="170" y="540" class="small-text">• 输出: frame_hiddens</text>

  <rect x="280" y="470" width="180" height="80" class="model" rx="5"/>
  <text x="370" y="495" class="text">postprocess_face()</text>
  <text x="370" y="510" class="small-text">• encode_video_merge()</text>
  <text x="370" y="525" class="small-text">• 人脸特征编码</text>
  <text x="370" y="540" class="small-text">• 输出: face_hiddens</text>

  <rect x="480" y="470" width="180" height="80" class="model" rx="5"/>
  <text x="570" y="495" class="text">postprocess_audio()</text>
  <text x="570" y="510" class="small-text">• encode_audio_merge()</text>
  <text x="570" y="525" class="small-text">• 音频特征编码</text>
  <text x="570" y="540" class="small-text">• 输出: audio_hiddens</text>

  <rect x="680" y="470" width="180" height="80" class="model" rx="5"/>
  <text x="770" y="495" class="text">postprocess_image()</text>
  <text x="770" y="510" class="small-text">• encode_image_merge()</text>
  <text x="770" y="525" class="small-text">• 图像特征编码</text>
  <text x="770" y="540" class="small-text">• 输出: image_hiddens</text>

  <rect x="880" y="470" width="180" height="80" class="model" rx="5"/>
  <text x="970" y="495" class="text">postprocess_multi()</text>
  <text x="970" y="510" class="small-text">• encode_multi_merge()</text>
  <text x="970" y="525" class="small-text">• 多模态融合</text>
  <text x="970" y="540" class="small-text">• 输出: multi_hiddens</text>

  <!-- 箭头从预处理到后处理 -->
  <line x1="600" y1="400" x2="600" y2="460" class="arrow"/>

  <!-- 4. 提示词生成阶段 -->
  <rect x="50" y="640" width="1100" height="120" class="box" rx="10"/>
  <text x="600" y="665" class="title" style="font-size: 16px;">4. 提示词生成阶段 (Prompt Generation)</text>

  <rect x="200" y="690" width="300" height="60" class="process" rx="5"/>
  <text x="350" y="715" class="text">get_prompt_for_multimodal()</text>
  <text x="350" y="730" class="small-text">根据face_or_frame类型生成多模态提示词</text>

  <rect x="550" y="690" width="300" height="60" class="process" rx="5"/>
  <text x="700" y="715" class="text">replace_token_for_multimodal()</text>
  <text x="700" y="730" class="small-text">替换特殊token为实际query token数量</text>

  <!-- 箭头 -->
  <line x1="500" y1="720" x2="550" y2="720" class="arrow"/>

  <!-- 5. 模型推理阶段 -->
  <rect x="50" y="780" width="1100" height="300" class="box" rx="10"/>
  <text x="600" y="805" class="title" style="font-size: 16px;">5. 模型推理阶段 (Model Inference)</text>

  <!-- Step 1: Token化 -->
  <rect x="80" y="830" width="200" height="60" class="process" rx="5"/>
  <text x="180" y="855" class="text">Step 1: Token化</text>
  <text x="180" y="870" class="small-text">prompt → input_ids</text>

  <!-- Step 2: 嵌入转换 -->
  <rect x="300" y="830" width="200" height="60" class="process" rx="5"/>
  <text x="400" y="855" class="text">Step 2: 嵌入转换</text>
  <text x="400" y="870" class="small-text">input_ids → input_embeds</text>

  <!-- Step 3: 特征替换 -->
  <rect x="520" y="830" width="200" height="60" class="process" rx="5"/>
  <text x="620" y="855" class="text">Step 3: 特征替换</text>
  <text x="620" y="870" class="small-text">替换patch token为特征</text>

  <!-- Step 4: 生成 -->
  <rect x="740" y="830" width="200" height="60" class="process" rx="5"/>
  <text x="840" y="855" class="text">Step 4: 生成</text>
  <text x="840" y="870" class="small-text">Qwen2.5生成响应</text>

  <!-- 特征映射详情 -->
  <rect x="100" y="920" width="1000" height="140" class="data" rx="5"/>
  <text x="600" y="945" class="text" style="font-weight: bold;">特征映射过程</text>
  
  <text x="150" y="970" class="small-text">&lt;FrameHere&gt; → frame_hiddens (32个token)</text>
  <text x="150" y="985" class="small-text">&lt;FaceHere&gt; → face_hiddens (32个token)</text>
  <text x="150" y="1000" class="small-text">&lt;AudioHere&gt; → audio_hiddens (8个token)</text>
  <text x="150" y="1015" class="small-text">&lt;ImageHere&gt; → image_hiddens (32个token)</text>
  <text x="150" y="1030" class="small-text">&lt;MultiHere&gt; → multi_hiddens (32个token)</text>

  <text x="650" y="970" class="small-text">最终输入到Qwen2.5的格式：</text>
  <text x="650" y="985" class="small-text">inputs_embeds: [1, seq_len, hidden_dim]</text>
  <text x="650" y="1000" class="small-text">attention_mask: [1, seq_len]</text>
  <text x="650" y="1015" class="small-text">生成参数: max_new_tokens=1200</text>
  <text x="650" y="1030" class="small-text">解码策略: do_sample=True, top_p=0.9</text>

  <!-- 箭头连接 -->
  <line x1="280" y1="860" x2="300" y2="860" class="arrow"/>
  <line x1="500" y1="860" x2="520" y2="860" class="arrow"/>
  <line x1="720" y1="860" x2="740" y2="860" class="arrow"/>

  <!-- 从后处理到推理的箭头 -->
  <line x1="600" y1="620" x2="600" y2="680" class="arrow"/>
  <line x1="600" y1="760" x2="600" y2="820" class="arrow"/>

  <!-- 6. 输出处理 -->
  <rect x="50" y="1100" width="1100" height="100" class="box" rx="10"/>
  <text x="600" y="1125" class="title" style="font-size: 16px;">6. 输出处理 (Output Processing)</text>

  <rect x="200" y="1150" width="200" height="40" class="output" rx="5"/>
  <text x="300" y="1175" class="text">去除特殊token</text>

  <rect x="450" y="1150" width="200" height="40" class="output" rx="5"/>
  <text x="550" y="1175" class="text">提取Assistant回复</text>

  <rect x="700" y="1150" width="200" height="40" class="output" rx="5"/>
  <text x="800" y="1175" class="text">最终情感分析结果</text>

  <!-- 箭头 -->
  <line x1="400" y1="1170" x2="450" y2="1170" class="arrow"/>
  <line x1="650" y1="1170" x2="700" y2="1170" class="arrow"/>
  <line x1="600" y1="1080" x2="600" y2="1140" class="arrow"/>

  <!-- 数据流向说明 -->
  <rect x="50" y="1220" width="1100" height="120" class="box" rx="10"/>
  <text x="600" y="1245" class="title" style="font-size: 16px;">关键数据流向</text>
  
  <text x="100" y="1270" class="small-text">1. 原始数据 → 预处理 → 标准化张量</text>
  <text x="100" y="1285" class="small-text">2. 标准化张量 → 编码器 → 高维特征表示</text>
  <text x="100" y="1300" class="small-text">3. 高维特征 + 文本提示 → Qwen2.5 → 情感分析结果</text>
  <text x="100" y="1315" class="small-text">4. 支持多种模态组合：face/frame/audio/text/multi</text>

  <text x="700" y="1270" class="small-text">核心技术特点：</text>
  <text x="700" y="1285" class="small-text">• 多模态特征对齐与融合</text>
  <text x="700" y="1300" class="small-text">• 基于Qwen2.5的大语言模型推理</text>
  <text x="700" y="1315" class="small-text">• 灵活的模态组合策略</text>

</svg>